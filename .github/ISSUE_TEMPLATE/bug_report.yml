name: Bug report
description: Something in WikiLens misbehaves.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Two things are expected, not bugs: games in **exclusive fullscreen** cover the overlay (switch the game to borderless/windowed), and the unsigned installer triggers a SmartScreen prompt. Everything else, please tell us.
  - type: input
    id: version
    attributes:
      label: WikiLens version
      description: Settings shows it, or the installer file name (`WikiLens_<version>_...`).
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: display-mode
    attributes:
      label: Game display mode
      options:
        - Borderless windowed
        - Windowed
        - Exclusive fullscreen
        - No game running
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and wiki
      description: The game picked in the header, or the wiki URL for a game you added yourself.
      placeholder: "Stardew Valley"
  - type: dropdown
    id: answers
    attributes:
      label: Where answers come from
      options:
        - Custom API (Anthropic / DeepSeek / OpenRouter)
        - Local AI (Ollama, LM Studio, llama.cpp, vLLM, …)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce, the question you asked if relevant, and the error text shown in the panel. Never paste an API key.
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug table (optional)
      description: Run with `WIKILENS_DEBUG=1` and paste the per-ask table from the terminal — it holds timings and page titles only, never wiki text or keys.
      render: text
