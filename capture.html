<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiLens Capture</title>
    <style>
      /* Transparent, like the overlay window (transparent:true renders a black
         rect without this). The window covers one monitor; the live desktop
         shows through, dimmed, so the user can pick a region of it. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Uniform dim shown before a drag starts (capture mode is active). */
      #backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
      }

      /* The drag rectangle: a bright (undimmed) hole punched through a huge
         box-shadow that dims everything outside it. */
      #selection {
        position: fixed;
        display: none;
        border: 1px solid #8ab4ff;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      }

      #hint {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: rgba(18, 18, 24, 0.9);
        color: #e8e8ee;
        font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="backdrop"></div>
    <div id="selection"></div>
    <div id="hint">Drag to capture · Esc to cancel</div>
    <script type="module" src="/src/capture/main.ts"></script>
  </body>
</html>
