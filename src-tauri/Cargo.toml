[package]
name = "wikilens"
version = "0.1.0"
description = "A Windows desktop overlay for wiki-heavy games"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wikilens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip` keeps OpenRouter's ~1-2 MB model catalog to ~150-300 KB on the wire.
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
futures-util = "0.3"
thiserror = "1"
dotenvy = "0.15"
# Screenshot capture: `xcap` snapshots the monitor under the cursor; `image`
# (png-encode only — pixels come pre-decoded from xcap, which re-exports this
# same 0.25 line) crops/downscales; `base64` builds the thumbnail data-URI.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Promoted from dev-only: the capture flow's ~120 ms settle sleep before the
# monitor snapshot (`tokio::time::sleep`, on Tauri's tokio runtime).
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# For #[tokio::test] in the ignored live-wiki integration test (wiki/mod.rs).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Scratch dirs for the user-wiki store's persistence tests (wiki/user.rs).
tempfile = "3"
# Local mock HTTP server for the offline streaming/fetch orchestration tests
# (vault/2026-07-13_rust-http-mock-integration-tests.md).
wiremock = "0.6"
# Snapshot tests freezing the cleaners' output over captured wiki pages, and
# property tests proving the cleaners and SSE line parsers never panic
# (vault/2026-07-13_parser-snapshot-property-tests.md).
insta = "1"
proptest = "1"
