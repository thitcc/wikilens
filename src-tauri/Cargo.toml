[package]
name = "wikilens"
version = "0.1.1"
description = "A Windows desktop overlay for wiki-heavy games"
authors = ["Thiago Tenório"]
license = "MIT"
repository = "https://github.com/thitcc/wikilens"
edition = "2021"
# Not a registry crate — and cargo-about (about.toml `private.ignore`) keys
# the app crate's exclusion from THIRD-PARTY-LICENSES.txt on this.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wikilens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `gzip` keeps OpenRouter's ~1-2 MB model catalog to ~150-300 KB on the wire.
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
futures-util = "0.3"
thiserror = "1"
dotenvy = "0.15"
# Screenshot capture: `xcap` snapshots the monitor under the cursor; `image`
# (png-encode only — pixels come pre-decoded from xcap, which re-exports this
# same 0.25 line) crops/downscales; `base64` builds the thumbnail data-URI.
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
# Promoted from dev-only: the capture flow's ~120 ms settle sleep before the
# monitor snapshot (`tokio::time::sleep`, on Tauri's tokio runtime).
tokio = { version = "1", features = ["time"] }
# CancellationToken for aborting an in-flight `ask` (the status row's Stop):
# level-triggered (a cancel landing before the await still fires) and needs no
# extra tokio features. Already in the tree transitively.
tokio-util = "0.7"

# DwmSetWindowAttribute(DWMWA_TRANSITIONS_FORCEDISABLED): suppress the OS's
# one-time window-open transition so a first show plays only the app's own
# entrance (window.rs::disable_os_open_transition). Already in the tree
# transitively at this version. Win32_Security_Cryptography adds DPAPI
# (CryptProtectData/CryptUnprotectData) for the API-key store (keys.rs,
# vault/2026-07-26_api-key-storage-dpapi.md); the LocalFree its blobs need
# lives in Win32_Foundation, already enabled. Win32_UI_WindowsAndMessaging +
# Win32_System_Threading add the foreground-window probe that reports which
# game the overlay is covering (GetForegroundWindow -> GetWindowThreadProcessId
# -> OpenProcess + QueryFullProcessImageNameW; detect/foreground.rs,
# vault/2026-08-04_game-auto-detection.md); both transitively imply
# Win32_Foundation, which stays listed for documentation.
# Win32_UI_WindowsAndMessaging also supplies SetWindowPos, the atomic
# move+resize behind window.rs::apply_rect (the split set_size/set_position
# pair wobbled bottom-pinned panels for a frame). Win32_UI_Input_KeyboardAndMouse
# adds GetAsyncKeyState so the drag-settle task can wait out a still-held
# mouse button before snapping the drop on-screen (window.rs::mouse_button_down).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# For #[tokio::test] in the ignored live-wiki integration test (wiki/mod.rs).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Scratch dirs for the persistent stores' tests (wiki/user.rs, settings.rs,
# keys.rs).
tempfile = "3"
# Local mock HTTP server for the offline streaming/fetch orchestration tests
# (vault/2026-07-13_rust-http-mock-integration-tests.md).
wiremock = "0.6"
# Builds the tiny-wire/huge-decompressed body for the byte-cap gzip-bomb test
# (vault/2026-07-13_wiki-fetch-hardening.md).
flate2 = "1"
# Snapshot tests freezing the cleaners' output over captured wiki pages, and
# property tests proving the cleaners and SSE line parsers never panic
# (vault/2026-07-13_parser-snapshot-property-tests.md).
insta = "1"
proptest = "1"
