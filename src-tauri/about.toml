# cargo-about config — the Rust half of THIRD-PARTY-LICENSES.txt, which
# `npm run licenses` (.claude/skills/licenses/licenses.mjs) generates and the
# installers ship next to WikiLens.exe (tauri.conf.json `bundle.resources`).
# See vault/2026-08-26_open-source-release-0-2-0.md.
#
# `accepted` is a PRIORITY list: an `A OR B` crate contributes only the first
# accepted alternative (spdx minimized_requirements), so MIT first keeps the
# file short; the operands of an `AND` must all be listed and all get
# printed. Never add LGPL/GPL: r-efi offers LGPL-2.1-or-later as a third
# alternative and must keep resolving to MIT. A crate under a license not
# listed here fails the run loudly — add it deliberately, with its text
# reviewed. 0BSD/Unlicense/CC0/BSL-1.0 are omitted on purpose: every crate
# offering them also offers MIT or Apache-2.0, which rank higher.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

# Windows is the only shipping platform: Linux/macOS/UEFI-only crates (the
# gtk/cocoa families, r-efi) never link into wikilens.exe.
targets = ["x86_64-pc-windows-msvc"]

# tauri-build and the test-only crates never ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The app crate itself (`publish = false` in Cargo.toml) is not third-party —
# and listing it would embed the app version, staling the file on every
# release bump (the release PR must stay bump-only). Inline form on purpose:
# a `[private]` table header would swallow every key after it.
private = { ignore = true }

# ring/rustls aren't in the Windows tree (reqwest uses native-tls/schannel);
# the stock unicode-ident workaround pins a Unicode-DFS-2016 checksum the
# current release no longer matches — its shipped license files detect fine.
workarounds = []
